<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="38" fill="#44D62C"/>
  <!-- BOX: baseline at y=100, font-size 70 → cap-height ~50px, so top ~50, bottom ~100 → centered in top half (0-100) -->
  <text
    x="100" y="100"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="70"
    fill="white"
    text-anchor="middle"
    dominant-baseline="text-after-edge"
    letter-spacing="-1">BOX</text>
  <!-- NOW: baseline at y=190, same metrics → top ~140, bottom ~190 → centered in bottom half (100-200) -->
  <text
    x="100" y="190"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="70"
    fill="white"
    text-anchor="middle"
    dominant-baseline="text-after-edge"
    letter-spacing="-1">NOW</text>
</svg>
